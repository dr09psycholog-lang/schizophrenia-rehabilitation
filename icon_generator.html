<!DOCTYPE html><html><head><meta charset='utf-8'><title>Icon</title></head><body><canvas id='c' width='256' height='256' style='display:none'></canvas><img id='img' width='256' height='256'><br><br><a id='dl' download='icon_vk.png'>Download PNG</a><br><br><textarea id='b64' rows='5' cols='80' placeholder='base64 here...'></textarea><script>var c=document.getElementById('c');var ctx=c.getContext('2d');var g=ctx.createLinearGradient(0,0,256,256);g.addColorStop(0,'#2787F5');g.addColorStop(1,'#1565C0');ctx.fillStyle=g;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(0,0,256,256,40);else ctx.rect(0,0,256,256);ctx.fill();ctx.fillStyle='white';ctx.font='bold 80px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Sz',128,110);ctx.font='28px Arial';ctx.fillText('Rehab',128,175);var dataUrl=c.toDataURL('image/png');document.getElementById('img').src=dataUrl;document.getElementById('dl').href=dataUrl;document.getElementById('b64').value=dataUrl.split(',')[1];</script></body></html>
